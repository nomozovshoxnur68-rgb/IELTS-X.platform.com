<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>IELTSX Game — host screen</title>
<meta name="theme-color" content="#2b0a45">
<link rel="icon" href="/assets/ieltsx-mark.png">
<link rel="stylesheet" href="/assets/css/game.css">
</head>
<body class="gh">
<div class="g-bg" aria-hidden="true"><span></span><span></span></div>

<header class="gh-top" id="top">
  <a class="g-brand" href="/admin#games" title="Admin panel"><img src="/assets/ieltsx-mark.png" alt=""></a>
  <div class="grow"><div class="gh-title" id="h-title">IELTSX Game</div><div class="gh-note" id="h-subject"></div></div>
  <span class="gh-pin" id="h-pin" hidden></span>
  <span class="gh-count" id="h-count" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><span id="h-count-n">0</span></span>
  <button class="gh-tbtn" id="h-lock" type="button" hidden></button>
  <button class="gh-tbtn" id="h-full" type="button" data-t="fullscreen">Full screen</button>
  <button class="gh-tbtn" id="h-end" type="button" data-t="endGame" hidden>End game</button>
  <button class="g-lang" id="lang-btn" type="button" aria-label="Language / Til / Язык"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg> UZ</button>
</header>

<main class="gh-stage" id="stage" aria-live="polite"><div class="g-dots" aria-hidden="true"><i></i><i></i><i></i></div></main>

<div class="g-offline" id="offline" role="status" hidden data-t="offline">Connection lost. Reconnecting…</div>
<div class="g-toast" id="toast" role="status" aria-live="polite"></div>
<script src="/assets/js/game-i18n.js"></script>
<script src="/assets/js/game-host.js"></script>
</body>
</html>
