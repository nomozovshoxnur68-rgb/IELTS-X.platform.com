<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users & Premium</title><link rel="stylesheet" href="/admin/admin.css"></head><body><div class="shell"><aside class="side"><div class="brand">IELTSX Admin</div><nav class="nav"><a href="/admin/admin.html" class="">Dashboard</a><a href="/admin/users.html" class="active">Users & Premium</a><a href="/admin/reading.html" class="">Reading Manager</a><a href="/admin/listening.html" class="">Listening Manager</a><a href="/admin/materials.html" class="">Materials</a><a href="/index.html">← Back to IELTSX</a></nav></aside><main class="main"><div class="top"><div><h1>Users & Premium</h1><div class="muted">Give or revoke premium access.</div></div></div><div class="card"><div class="toolbar"><input id="q" class="input" placeholder="Search users"><select id="f" class="select"><option value="all">All users</option><option value="premium">Premium</option><option value="free">Free</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>User</th><th>Email</th><th>Status</th><th>Expires</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script src="/admin/admin-owner-guard.js"></script><script src="/admin/admin-common.js"></script><script>function render(){let q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('f').value,u=A.users().filter(x=>(x.name+' '+x.email).toLowerCase().includes(q)).filter(x=>f==='all'||(f==='premium'&&x.premium)||(f==='free'&&!x.premium));rows.innerHTML=u.length?u.map(x=>`<tr><td>${x.name||'-'}</td><td>${x.email||'-'}</td><td><span class="badge ${x.premium?'ok':'no'}">${x.premium?'Premium':'Free'}</span></td><td>${x.premiumUntil||'—'}</td><td><button class="btn ${x.premium?'danger':'primary'}" onclick="toggle('${x.email}',${!x.premium})">${x.premium?'Revoke':'Give Premium'}</button></td></tr>`).join(''):'<tr><td colspan=5>No users found</td></tr>'}function toggle(e,on){let u=A.users(),x=u.find(a=>a.email===e);if(!x)return;x.premium=on;x.premiumUntil=on?new Date(Date.now()+365*864e5).toISOString().slice(0,10):null;A.saveUsers(u);render()}q.oninput=f.onchange=render;render()</script></body></html>
