<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Dashboard</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="shell">
        <aside class="side">
            <div class="brand">IELTSX Admin</div>
            <nav class="nav"><a href="admin.html" class="active">Dashboard</a><a href="users.html" class="">Users &
                    Premium</a><a href="reading.html" class="">Reading Manager</a><a href="listening.html"
                    class="">Listening Manager</a><a href="materials.html" class="">Materials</a><a
                    href="../index.html">← Back to IELTSX</a></nav>
        </aside>
        <main class="main">
            <div class="top">
                <div class="title">
                    <h1>Admin Dashboard</h1>
                    <div class="muted">IELTSX content and premium control center</div>
                </div><button class="btn"
                    onclick="localStorage.removeItem('ieltsx_admin_session');location='admin-login.html'">Logout</button>
            </div>
            <div class="grid">
                <div class="card">Users<div class="stat" id="u">0</div>
                </div>
                <div class="card">Premium<div class="stat" id="p">0</div>
                </div>
                <div class="card">Reading<div class="stat" id="r">0</div>
                </div>
                <div class="card">Listening<div class="stat" id="l">0</div>
                </div>
            </div>
            <div class="card"><a class="btn primary" href="users.html">Manage Premium</a> <a class="btn"
                    href="reading.html">Add Reading</a> <a class="btn" href="listening.html">Add Listening</a></div>
        </main>
    </div>
    <script src="admin-owner-guard.js"></script>
    <script src="admin-common.js"></script>
    <script>let u = A.users(); u1 = document.getElementById('u'); u1.textContent = u.length; document.getElementById('p').textContent = u.filter(x => x.premium).length; document.getElementById('r').textContent = A.items('reading_tests').length; document.getElementById('l').textContent = A.items('listening_tests').length</script>
</body>

</html>
