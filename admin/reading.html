<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Reading Manager · IELTSX Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand">IELTSX Admin</div><nav class="nav"><a href="/admin.html#dashboard">Dashboard</a><a href="/admin.html#users">Users &amp; Premium</a><a href="/admin.html#orders">Orders</a><a href="/admin/reading.html" class="active">Reading Manager</a><a href="/admin/listening.html">Listening Manager</a><a href="/index.html">← Back to IELTSX</a></nav></aside>
<main class="main">
<div class="top"><div><h1>Reading Manager</h1><div class="muted">Add and remove reading materials.</div></div></div>
<div class="card">
<h2>Upload Reading file</h2>
<div class="muted">The uploaded file is stored on the server; its link is filled into the form below.</div>
<form id="uploadForm" style="margin-top:14px">
<input type="hidden" name="type" value="reading">
<div class="toolbar"><input class="input" type="file" name="file" accept=".html,.htm,.txt,.pdf" required><button class="btn primary" type="submit">Upload</button></div>
<div id="uploadMsg" class="muted"></div>
</form>
</div>
<div class="card"><form id="form"><div class="formgrid">
<div class="field"><label for="title">Title</label><input id="title" class="input" required maxlength="80"></div>
<div class="field"><label for="pack">Pack</label><input id="pack" class="input" maxlength="80"></div>
<div class="field full"><label for="desc">Description</label><textarea id="desc" class="input textarea"></textarea></div>
<div class="field"><label for="content">File / Content path</label><input id="content" class="input" placeholder="/uploads/reading/..."></div>
<div class="field"><label for="prem">Access</label><select id="prem" class="select"><option value="false">Free</option><option value="true">Premium</option></select></div>
</div><br><button class="btn primary">Add Reading</button></form></div>
<div class="card"><input id="search" class="input" placeholder="Search"><div class="tablewrap"><table class="table"><thead><tr><th>Title</th><th>Pack</th><th>Access</th><th>Content</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main>
</div>
<script src="admin-common.js"></script>
<script>
const TYPE = 'reading';
let items = [];
function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const list = items.filter((x) => (x.title + ' ' + (x.pack || '')).toLowerCase().includes(q));
  document.getElementById('rows').innerHTML = list.length ? list.map((x) => `<tr><td>${A.esc(x.title)}</td><td>${A.esc(x.pack) || '—'}</td><td><span class="badge ${x.premium ? 'ok' : 'no'}">${x.premium ? 'Premium' : 'Free'}</span></td><td>${A.esc(x.content) || '—'}</td><td style="white-space:nowrap"><button class="btn" data-toggle="${A.esc(x.id)}" data-premium="${x.premium ? '1' : '0'}">${x.premium ? 'Make free' : 'Make premium'}</button> <button class="btn danger" data-del="${A.esc(x.id)}">Delete</button></td></tr>`).join('') : '<tr><td colspan="5">No materials yet</td></tr>';
}
async function load() { items = (await A.api('/api/admin/materials?type=' + TYPE)).items; render(); }
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await A.api('/api/admin/materials', { method: 'POST', body: JSON.stringify({ type: TYPE, title: document.getElementById('title').value, pack: document.getElementById('pack').value, description: document.getElementById('desc').value, content: document.getElementById('content').value, premium: document.getElementById('prem').value === 'true' }) });
    document.getElementById('form').reset(); A.toast('Added'); load();
  } catch (err) { A.toast(err.message, true); }
};
document.addEventListener('click', async (e) => {
  const tg = e.target.closest('[data-toggle]');
  if (tg) {
    try { await A.api('/api/admin/materials/' + encodeURIComponent(tg.dataset.toggle), { method: 'PATCH', body: JSON.stringify({ premium: tg.dataset.premium !== '1' }) }); A.toast('Saved'); load(); } catch (err) { A.toast(err.message, true); }
    return;
  }
  const b = e.target.closest('[data-del]'); if (!b || !confirm('Delete this material?')) return;
  try { await A.api('/api/admin/materials/' + encodeURIComponent(b.dataset.del), { method: 'DELETE' }); A.toast('Deleted'); load(); } catch (err) { A.toast(err.message, true); }
});
document.getElementById('uploadForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const msg = document.getElementById('uploadMsg'); msg.textContent = 'Uploading...';
  try {
    const d = await A.api('/api/admin/uploads', { method: 'POST', body: new FormData(this) });
    msg.textContent = 'Uploaded: ' + d.originalName + ' — ' + d.url; document.getElementById('content').value = d.url;
  } catch (err) { msg.textContent = 'Upload failed: ' + err.message; }
});
document.getElementById('search').oninput = render;
A.ready.then(load).catch((e) => A.toast(e.message, true));
</script>
</body>
</html>
