<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Manager</title><link rel="stylesheet" href="admin.css"></head><body><div class="shell"><aside class="side"><div class="brand">IELTSX Admin</div><nav class="nav"><a href="admin.html" class="">Dashboard</a><a href="users.html" class="">Users & Premium</a><a href="reading.html" class="active">Reading Manager</a><a href="listening.html" class="">Listening Manager</a><a href="materials.html" class="">Materials</a><a href="../index.html">← Back to IELTSX</a></nav></aside><main class="main"><div class="top"><div><h1>Reading Manager</h1><div class="muted">Add and remove reading materials.</div></div></div>
<div class="card">
<h2>Upload Reading file</h2>
<div class="muted">The uploaded file is stored on the server and can then be attached to a material.</div>
<form id="uploadForm" style="margin-top:14px">
<input type="hidden" name="type" value="reading">
<div class="toolbar">
<input class="input" type="file" name="file" accept=".html,.htm,.txt,.pdf" required>
<button class="btn primary" type="submit">Upload</button>
</div>
<div id="uploadMsg" class="muted"></div>
</form>
</div>
<div class="card"><form id="form"><div class="formgrid"><div class="field"><label>Title</label><input id="title" class="input" required></div><div class="field"><label>Pack</label><input id="pack" class="input"></div><div class="field full"><label>Description</label><textarea id="desc" class="input textarea"></textarea></div><div class="field"><label>File / Content path</label><input id="content" class="input"></div><div class="field"><label>Access</label><select id="prem" class="select"><option value="false">Free</option><option value="true">Premium</option></select></div></div><br><button class="btn primary">Add Reading</button></form></div><div class="card"><input id="search" class="input" placeholder="Search"><div class="tablewrap"><table class="table"><thead><tr><th>Title</th><th>Pack</th><th>Access</th><th>Content</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><script src="admin-owner-guard.js"></script><script src="admin-common.js"></script><script>const key='reading_tests';function render(){let q=search.value.toLowerCase(),a=A.items(key).filter(x=>(x.title+' '+x.pack).toLowerCase().includes(q));rows.innerHTML=a.length?a.map((x,i)=>`<tr><td>${x.title}</td><td>${x.pack||'—'}</td><td><span class="badge ${x.premium?'ok':'no'}">${x.premium?'Premium':'Free'}</span></td><td>${x.content||'—'}</td><td><button class="btn danger" onclick="del(${i})">Delete</button></td></tr>`).join(''):'<tr><td colspan=5>No materials yet</td></tr>'}form.onsubmit=e=>{e.preventDefault();let a=A.items(key);a.push({title:title.value,pack:pack.value,description:desc.value,content:content.value,premium:prem.value==='true'});A.save(key,a);form.reset();render()}function del(i){let a=A.items(key);a.splice(i,1);A.save(key,a);render()}search.oninput=render;render()</script><script>
document.getElementById('uploadForm').addEventListener('submit', async function(e){
 e.preventDefault();
 const msg=document.getElementById('uploadMsg');
 msg.textContent='Uploading...';
 try{
   const r=await fetch('../api/admin/uploads',{method:'POST',body:new FormData(this)});
   const d=await r.json();
   if(!r.ok||!d.ok) throw new Error(d.error||'Upload failed');
   msg.textContent='Uploaded: '+d.originalName+' — '+d.url;
 }catch(err){msg.textContent='Upload failed: '+err.message}
});
</script></body></html>
