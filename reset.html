<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a new password — IELTS X</title>
    <meta name="robots" content="noindex">
    <script src="assets/js/theme-init.js"></script>
    <link rel="icon" href="assets/ieltsx-only-logo-BajnupZg.png">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body data-page="reset">
    <header class="topbar">
        <a href="/" class="brand" aria-label="IELTS X home"><img src="assets/ieltsx-logo-transparent.png" alt="IELTS X"></a>
        <a href="/login" class="btn-ghost">Sign in</a>
    </header>
    <main class="stage">
        <section class="card">
            <h1>Choose a new password</h1>
            <p class="sub">Use at least 8 characters with letters and a number or symbol. You will be signed in right after.</p>
            <form id="form" novalidate>
                <div class="field"><label for="password">New password</label>
                <div class="pw"><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required placeholder="At least 8 characters">
                <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Show password" aria-pressed="false">Show</button></div></div>
                <div class="field"><label for="password2">Repeat password</label>
                <input id="password2" type="password" autocomplete="new-password" required placeholder="Repeat the password"></div>
                <p id="error" class="error" role="alert" aria-live="polite"></p>
                <button type="submit" id="submit" class="btn-primary">Save password</button>
            </form>
            <p class="switch"><a class="link" href="/forgot">Send me a new link</a></p>
        </section>
    </main>
    <script type="module" src="assets/js/auth-pages.js"></script>
</body>
</html>
