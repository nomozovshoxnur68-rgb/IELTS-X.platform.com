<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
html.dark-mode body{background:#0b0f14;color:#e5e7eb}main{width:100%;max-width:560px;padding:28px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(15,23,42,.06)}html.dark-mode .card{background:#131920;border-color:#263041}

ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}li a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;color:inherit;text-decoration:none;font-weight:600}li a:hover{background:#f1f5f9}html.dark-mode li a{border-color:#263041}html.dark-mode li a:hover{background:#1b2430}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#dcfce7;color:#166534}.tag.pro{background:#fef3c7;color:#92400e}.num{color:#64748b;font-weight:500;margin-right:8px}</style>
